services:
  - type: web
    name: psx-stock-screener
    runtime: python
    buildCommand: "pip install -r requirements.txt || true"
    startCommand: "python server.py"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      # Secrets — set these in the Render dashboard (never commit them)
      - key: ADMIN_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Persistent storage (needs a paid plan with a disk). Uncomment both blocks:
      # - key: PSX_DATA_DIR
      #   value: /var/data
    # disk:
    #   name: psx-data
    #   mountPath: /var/data
    #   sizeGB: 1
