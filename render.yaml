services:
  - type: web
    name: psx-stock-screener
    runtime: python
    buildCommand: "pip install -r requirements.txt || true"
    startCommand: "python server.py"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      # Secrets — set these in the Render dashboard (never commit them)
      - key: ADMIN_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
